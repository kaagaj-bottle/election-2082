# Host nginx server block for the election site.
# Install: sudo cp nginx/election-api.conf /etc/nginx/sites-available/election-2082
#          sudo ln -s /etc/nginx/sites-available/election-2082 /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Replace server_name with your subdomain, then add HTTPS the same way as your other sites:
#          sudo certbot --nginx -d election-2082.whatever.com.np

server {
    listen 80;
    server_name election-2082.whatever.com.np;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
